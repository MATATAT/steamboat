[package]
name = "steamboat"
version = "0.1.0"
edition = "2024"
description = "Copy files between machines on the same LAN, with mDNS discovery and resumable transfers"
repository = "https://github.com/MATATAT/steamboat"
license = "MIT OR Apache-2.0"
keywords = ["lan", "file-transfer", "steamos", "mdns"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "steamboat"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.6"
clap = { version = "4.6.6", features = ["derive"] }
gethostname = "1.1.0"
indicatif = "0.18.6"
mdns-sd = "0.21.0"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
