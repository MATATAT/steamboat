[package]
name = "steamboat"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "steamboat"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.100"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }

[dev-dependencies]
pretty_assertions = "1.4.1"
