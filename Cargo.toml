[package]
name = "steamboat"
version = "0.0.0"
edition = "2024"

[[bin]]
name = "steamboat"
path = "src/bin/main.rs"

[dependencies]
anyhow = "1.0.100"
blake3 = "1.8.6"
postcard = { version = "1.1.3", features = ["use-std"] }
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["full"] }
unicode-normalization = "0.1.25"
walkdir = "2.5.0"

[dev-dependencies]
pretty_assertions = "1.4.1"
tempfile = "3.27.0"
